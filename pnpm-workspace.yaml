# NativeWind v5 requires exactly lightningcss 1.30.1: a newer native binary
# fails to deserialize the compiled stylesheet at bundle time. pnpm v11 reads
# overrides from here rather than from package.json.
overrides:
  lightningcss: 1.30.1

patchedDependencies:
  react-native-reanimated: patches/react-native-reanimated.patch
  react-native-worklets: patches/react-native-worklets.patch
